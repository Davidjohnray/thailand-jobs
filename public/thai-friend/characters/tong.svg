<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Tong - older woman, market vendor, originally from Khon Kaen</title>
<rect width="400" height="600" fill="#14201C"/>
<circle cx="70" cy="90" r="65" fill="#2F6B52" opacity="0.32"/>
<circle cx="330" cy="490" r="90" fill="#D4A24C" opacity="0.14"/>

<!-- shoulders/shirt -->
<path d="M 84 600 Q 84 428 200 417 Q 316 428 316 600 Z" fill="#B5622F"/>
<path d="M 160 462 L 240 462 L 246 600 L 154 600 Z" fill="#F5EFE1" opacity="0.88"/>

<!-- neck -->
<rect x="178" y="372" width="44" height="58" rx="10" fill="#B87A50"/>

<!-- head -->
<ellipse cx="200" cy="322" rx="80" ry="88" fill="#C6875A"/>

<!-- hair, bun -->
<path d="M 122 315 Q 112 220 200 212 Q 288 220 278 315 Q 274 250 200 245 Q 126 250 122 315 Z" fill="#2A2018"/>
<circle cx="200" cy="200" r="26" fill="#2A2018"/>

<!-- headscarf tied at back -->
<path d="M 130 245 Q 200 205 270 245 Q 255 232 200 226 Q 145 232 130 245 Z" fill="#D4A24C"/>

<!-- ears -->
<ellipse cx="123" cy="330" rx="12" ry="17" fill="#C6875A"/>
<ellipse cx="277" cy="330" rx="12" ry="17" fill="#C6875A"/>
<circle cx="123" cy="335" r="5" fill="#D4A24C"/>
<circle cx="277" cy="335" r="5" fill="#D4A24C"/>

<!-- eyebrows -->
<path d="M 160 300 Q 176 293 193 299" stroke="#2A2018" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M 207 299 Q 224 293 240 300" stroke="#2A2018" stroke-width="5" fill="none" stroke-linecap="round"/>

<!-- laugh line hints -->
<path d="M 155 340 Q 150 355 156 368" stroke="#A66E45" stroke-width="2" fill="none" opacity="0.5"/>
<path d="M 245 340 Q 250 355 244 368" stroke="#A66E45" stroke-width="2" fill="none" opacity="0.5"/>

<!-- eyes -->
<ellipse cx="176" cy="317" rx="8" ry="6.5" fill="#241A12"/>
<ellipse cx="224" cy="317" rx="8" ry="6.5" fill="#241A12"/>

<!-- nose -->
<path d="M 200 317 Q 194 342 200 350 Q 207 348 205 341" stroke="#9C6640" stroke-width="3" fill="none" stroke-linecap="round"/>

<!-- big warm laugh -->
<path d="M 166 362 Q 200 392 234 362" stroke="#7A4A2E" stroke-width="6" fill="none" stroke-linecap="round"/>

<!-- collar detail -->
<path d="M 160 462 Q 200 486 240 462" stroke="#B5622F" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
