<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Bank - young man, casual, Bangkok</title>
<rect width="400" height="600" fill="#14201C"/>
<circle cx="90" cy="80" r="60" fill="#2F6B52" opacity="0.35"/>
<circle cx="340" cy="480" r="90" fill="#D4A24C" opacity="0.15"/>
<rect x="0" y="0" width="400" height="600" fill="#1B2B25" opacity="0.4"/>

<!-- shoulders/shirt -->
<path d="M 90 600 Q 90 430 200 420 Q 310 430 310 600 Z" fill="#2F6B52"/>
<path d="M 160 470 L 240 470 L 250 600 L 150 600 Z" fill="#F5EFE1" opacity="0.9"/>

<!-- neck -->
