<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Somchai - older man, retired teacher, Ayutthaya</title>
<rect width="400" height="600" fill="#14201C"/>
<circle cx="320" cy="90" r="70" fill="#D4A24C" opacity="0.15"/>
<circle cx="60" cy="500" r="80" fill="#2F6B52" opacity="0.3"/>

<!-- shoulders/shirt -->
<path d="M 85 600 Q 85 425 200 415 Q 315 425 315 600 Z" fill="#3D4A3F"/>
<path d="M 155 460 L 245 460 L 252 600 L 148 600 Z" fill="#F5EFE1" opacity="0.92"/>

<!-- neck -->
<rect x="176" y="375" width="48" height="55" rx="10" fill="#C08256"/>

<!-- head -->
<ellipse cx="200" cy="325" rx="80" ry="88" fill="#CA8B5C"/>

<!-- grey hair sides only, receding -->
<path d="M 128 300 Q 122 260 150 240 Q 140 275 145 310 Z" fill="#B9B4A8"/>
<path d="M 272 300 Q 278 260 250 240 Q 260 275 255 310 Z" fill="#B9B4A8"/>
<path d="M 150 235 Q 200 215 250 235 Q 235 225 200 224 Q 165 225 150 235 Z" fill="#B9B4A8"/>

<!-- ears -->
<ellipse cx="120" cy="330" rx="12" ry="18" fill="#CA8B5C"/>
<ellipse cx="280" cy="330" rx="12" ry="18" fill="#CA8B5C"/>

<!-- glasses -->
<circle cx="176" cy="318" r="24" fill="none" stroke="#1A1512" stroke-width="4"/>
<circle cx="224" cy="318" r="24" fill="none" stroke="#1A1512" stroke-width="4"/>
<line x1="200" y1="318" x2="200" y2="318" stroke="#1A1512" stroke-width="4"/>
<line x1="152" y1="316" x2="128" y2="322" stroke="#1A1512" stroke-width="3"/>
<line x1="248" y1="316" x2="272" y2="322" stroke="#1A1512" stroke-width="3"/>

<!-- eyebrows, grey -->
<path d="M 158 292 Q 176 285 194 291" stroke="#B9B4A8" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M 206 291 Q 224 285 242 292" stroke="#B9B4A8" stroke-width="5" fill="none" stroke-linecap="round"/>

<!-- eyes -->
<ellipse cx="176" cy="318" rx="7" ry="6" fill="#241A12"/>
<ellipse cx="224" cy="318" rx="7" ry="6" fill="#241A12"/>

<!-- nose -->
<path d="M 200 318 Q 194 345 200 354 Q 208 352 205 344" stroke="#A66E45" stroke-width="3" fill="none" stroke-linecap="round"/>

<!-- moustache + smile -->
<path d="M 172 362 Q 200 356 228 362" stroke="#B9B4A8" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M 176 372 Q 200 388 224 372" stroke="#8A5638" stroke-width="5" fill="none" stroke-linecap="round"/>

<!-- collar -->
<path d="M 155 460 L 200 490 L 245 460" stroke="#3D4A3F" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
