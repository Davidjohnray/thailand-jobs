<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Nueng - young woman, guesthouse host, Chiang Mai</title>
<rect width="400" height="600" fill="#14201C"/>
<circle cx="340" cy="100" r="75" fill="#D4A24C" opacity="0.16"/>
<circle cx="50" cy="470" r="85" fill="#2F6B52" opacity="0.3"/>

<!-- shoulders/blouse -->
<path d="M 82 600 Q 82 420 200 408 Q 318 420 318 600 Z" fill="#D4A24C"/>
<path d="M 158 455 L 242 455 L 248 600 L 152 600 Z" fill="#F5EFE1" opacity="0.9"/>

<!-- neck -->
<rect x="178" y="368" width="44" height="58" rx="10" fill="#DA9F72"/>

<!-- head -->
<ellipse cx="200" cy="318" rx="78" ry="88" fill="#E2A87A"/>

<!-- hair, shoulder length, tucked behind ears -->
<path d="M 120 310 Q 108 200 200 195 Q 292 200 280 310 Q 285 420 268 450 L 255 440 Q 268 360 262 300 Q 255 240 200 235 Q 145 240 138 300 Q 132 360 145 440 L 132 450 Q 115 420 120 310 Z" fill="#241A12"/>

<!-- ears -->
<ellipse cx="122" cy="322" rx="11" ry="17" fill="#E2A87A"/>
<ellipse cx="278" cy="322" rx="11" ry="17" fill="#E2A87A"/>

<!-- eyebrows -->
<path d="M 162 296 Q 177 289 192 295" stroke="#241A12" stroke-width="4.5" fill="none" stroke-linecap="round"/>
<path d="M 208 295 Q 223 289 238 296" stroke="#241A12" stroke-width="4.5" fill="none" stroke-linecap="round"/>

<!-- eyes -->
<ellipse cx="177" cy="312" rx="9" ry="7.5" fill="#241A12"/>
<ellipse cx="223" cy="312" rx="9" ry="7.5" fill="#241A12"/>

<!-- nose -->
<path d="M 200 312 Q 195 336 200 343 Q 206 341 204 335" stroke="#C68956" stroke-width="3" fill="none" stroke-linecap="round"/>

<!-- warm smile -->
<path d="M 170 358 Q 200 378 230 358" stroke="#A15C3E" stroke-width="5" fill="none" stroke-linecap="round"/>

<!-- blouse collar detail -->
<path d="M 158 455 Q 200 480 242 455" stroke="#D4A24C" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
